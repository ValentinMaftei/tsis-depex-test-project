      - name: Generate access token for Depex API
        id: get_token
        env:
          LOGIN_URL: https://tasimetric-willard-noncosmic.ngrok-free.dev/user/login
          LOGIN_EMAIL: ${{ secrets.DEPEX_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.DEPEX_PASSWORD }}
        run: |
          AUTH_PAYLOAD=$(jq -n \
            --arg email "$LOGIN_EMAIL" \
            --arg password "$LOGIN_PASSWORD" \
            '{email: $email, password: $password}')

          response=$(curl -s -c cookies.txt -w "\n%{http_code}" -X POST "$LOGIN_URL" \
            -H "Content-Type: application/json" \
            -d "$AUTH_PAYLOAD")

          TOKEN=$(grep "access_token" cookies.txt | awk '{print $NF}')
          echo "Extracted Token: $TOKEN"
          echo "ACCESS_TOKEN=$TOKEN" >> $GITHUB_ENV
            
