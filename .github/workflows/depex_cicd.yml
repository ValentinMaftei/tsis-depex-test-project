name: Depex CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest tests/ --cov=app --cov-report=term-missing

      - name: Build Docker image
        run: |
          docker build -t fastapi-task-management .

      - name: Make request to external service
        run: |
          RESPONSE=$(curl -sS -X GET "https://tasimetric-willard-noncosmic.ngrok-free.dev/health")
          echo "$RESPONSE"