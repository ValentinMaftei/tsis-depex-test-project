name: Depex CI/CD Pipeline

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest tests/ --cov=app --cov-report=term-missing

      - name: Run tests with Coverage
        run: |
          pytest --junitxml=pytest.xml --cov-report=term-missing:skip-covered --cov=app tests/ | tee pytest-coverage.txt

      - name: Pytest coverage comment
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml
          title: "🧪 Depex Test Report" 
          badge-title: "Coverage"
          hide-badge: false
          hide-report: false
          create-new-comment: false 

      - name: Build Docker image
        run: |
          docker build -t fastapi-task-management .

      # - name: Make request to external service
      #   env:
      #     LOGIN_URL: https://tasimetric-willard-noncosmic.ngrok-free.dev/auth/login
      #     LOGIN_EMAIL: ${{ secrets.DEPEX_EMAIL }}
      #     LOGIN_PASSWORD: ${{ secrets.DEPEX_PASSWORD }}
      #   run: |
      #     RESPONSE=$(curl -sS -X POST "$LOGIN_URL" \
      #       -H "Content-Type: application/json" \
      #       -d "{\"email\":\"$LOGIN_EMAIL\", \"password\":\"$LOGIN_PASSWORD\"}")

      #     TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')

      #     if [ "$TOKEN" == "null" ] || [ -z "$TOKEN" ]; then
      #       echo "Error: Could not extract access token"
      #       exit 1
      #     fi

      #     echo "ACCESS_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Check API and Generate Report
        id: api_check
        env:
          LOGIN_URL: https://tasimetric-willard-noncosmic.ngrok-free.dev/auth/login
          LOGIN_EMAIL: ${{ secrets.DEPEX_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.DEPEX_PASSWORD }}
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST "$LOGIN_URL" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$LOGIN_EMAIL\", \"password\":\"$LOGIN_PASSWORD\"}")

          echo "Full response: $response"

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)
          
          echo "HTTP Code: $http_code"
          echo "Response Body: $body"

          TOKEN=$(echo "$body" | jq -r '.access_token')
          USER_ID=$(echo "$body" | jq -r '.user_id')

          if [ "$TOKEN" == "null" ] || [ -z "$TOKEN" ]; then
            echo "Error: Could not extract access token"
            exit 1
          fi

          echo "ACCESS_TOKEN=$TOKEN" >> $GITHUB_ENV
          echo "USER_ID=$USER_ID" >> $GITHUB_ENV

      - name: Check file validity
        id: file_check
        if: env.ACCESS_TOKEN != ''
        env:
          FILE_CHECK_URL: https://tasimetric-willard-noncosmic.ngrok-free.dev/operation/file/valid_file
        run: |
          FILE_CHECK_BODY="{\"requirement_file_id\":\"4:abb5c34b-b162-429b-8e37-14c18b6be2a2:65388527\", \"max_level\":2, \"node_type\":\"PyPIPackage\"}"

          response=$(curl -s -w "\n%{http_code}" -X POST "$FILE_CHECK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -d "$FILE_CHECK_BODY")

          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)

          if [ "$code" == "200" ] || [ "$code" == "201" ]; then
             icon="🟢"
             msg="Valid File"
          else
             icon="🔴"
             msg="Error"
          fi

          echo "## Validity" > api_report.md
          echo "" >> api_report.md
          echo "| Check | Status | HTTP Code |" >> api_report.md
          echo "| :--- | :--- | :--- |" >> api_report.md
          echo "| **1. File Validity** | $icon **$msg** | \`$code\` |" >> api_report.md
          
      - name: Minimize Impact Report
        if: env.ACCESS_TOKEN != ''
        env:
          IMPACT_URL: https://tasimetric-willard-noncosmic.ngrok-free.dev/operation/file/minimize_impact
        run: |
          IMPACT_BODY="{\"requirement_file_id\":\"4:abb5c34b-b162-429b-8e37-14c18b6be2a2:65388527\", \"limit\":1, \"max_level\":2, \"node_type\":\"PyPIPackage\", \"agregator\":\"mean\"}"

          response=$(curl -s -w "\n%{http_code}" -X POST "$IMPACT_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -d "$IMPACT_BODY")

          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)

          echo "Impact Response Body: $body"
          echo "$body" > impact_body.json

          if [ "$code" == "200" ] || [ "$code" == "201" ]; then
             icon="🟢"
             msg="Impact Analyzed"
          else
             icon="🔴"
             msg="Error"
          fi

          echo "| **2. Minimize Impact** | $icon **$msg** | \`$code\` |" >> api_report.md
          echo "" >> api_report.md

      - name: Build dependency update comment
        if: env.ACCESS_TOKEN != ''
        run: |
          if [ ! -f impact_body.json ]; then
            echo "No impact_body.json to parse"; exit 0
          fi

          jq '.result[0]' impact_body.json > impact_obj.json

          echo "## Suggested Dependency Updates" >> api_report.md
          echo "" >> api_report.md

          awk -F'==' 'NF==2 {print tolower($1) "=" $2}' requirements.txt > req_map.txt

          while IFS='=' read -r name req_ver; do
            imp_ver=$(jq -r --arg k "$name" '.[$k] // empty' impact_obj.json)
            if [ -n "$imp_ver" ]; then
              echo "- For library $name: from version $req_ver (requirements.txt) to version $imp_ver (Depex response)" >> api_report.md
            fi
          done < req_map.txt

      - name: Post API Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: api-check-report 
          path: api_report.md