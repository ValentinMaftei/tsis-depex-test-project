      - name: Check file validity
        id: file_check
        if: env.ACCESS_TOKEN != ''
        env:
          FILE_CHECK_URL: https://tasimetric-willard-noncosmic.ngrok-free.dev/operation/file/valid_file
        run: |
          FILE_CHECK_BODY="{\"requirement_file_id\":\"4:abb5c34b-b162-429b-8e37-14c18b6be2a2:65388527\", \"max_level\":2, \"node_type\":\"PyPIPackage\"}"

          response=$(curl -s -w "\n%{http_code}" -X POST "$FILE_CHECK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -d "$FILE_CHECK_BODY")

          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)

          if [ "$code" == "200" ] || [ "$code" == "201" ]; then
             icon="🟢"
             msg="Valid File"
          else
             icon="🔴"
             msg="Error"
          fi

          echo "## Validity" > api_report.md
          echo "" >> api_report.md
          echo "| Check | Status | HTTP Code |" >> api_report.md
          echo "| :--- | :--- | :--- |" >> api_report.md
          echo "| **1. File Validity** | $icon **$msg** | \`$code\` |" >> api_report.md
          echo "" >> api_report.md
          

      - name: Post API Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: api-check-report 
          path: api_report.md